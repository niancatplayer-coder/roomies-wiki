<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roomies Wiki — Votaciones</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background-color: #fdf6fb;
      color: #5a5a6a;
      line-height: 1.6;
    }

    .banner {
      background: linear-gradient(135deg, #ffd6e8, #c9e4ff, #d6f5d6, #fff3c4);
      text-align: center;
      padding: 50px 20px;
      border-bottom: 3px solid #e8a0c8;
    }

    .banner h1 {
      font-size: 2.8rem;
      color: #8a4a6a;
      letter-spacing: 3px;
      margin-bottom: 8px;
      text-shadow: 1px 1px 0 #ffffff;
    }

    .banner p {
      font-size: 1.05rem;
      color: #7a5a7a;
      max-width: 600px;
      margin-left: auto;
      margin-right: auto;
      text-align: center;
    }

    .contenido {
      max-width: 1000px;
      margin-left: auto;
      margin-right: auto;
      padding: 40px 20px;
      width: 100%;
    }

    .volver {
      display: inline-block;
      margin-bottom: 25px;
      color: #7a7a8a;
      text-decoration: none;
      font-size: 0.95rem;
    }

    .volver:hover { color: #c06090; }

    .pregunta {
      text-align: center;
      margin-bottom: 30px;
    }

    .pregunta h2 {
      font-size: 1.6rem;
      color: #8a4a6a;
      margin-bottom: 6px;
    }

    .pregunta p {
      font-size: 0.95rem;
      color: #9a9aaa;
    }

    .seccion-titulo {
      font-size: 1.15rem;
      font-weight: 700;
      color: #8a4a6a;
      margin: 10px 0 20px;
      text-align: center;
      letter-spacing: 1px;
    }

    .grilla {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 16px;
    }

    .carta {
      background-color: #ffffff;
      border: 2px solid #f0d8e8;
      border-radius: 16px;
      padding: 18px 12px 14px;
      text-align: center;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s, border-color 0.15s;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
      position: relative;
    }

    .carta:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 18px rgba(0,0,0,0.10);
    }

    .carta.seleccionada {
      border-color: #e070a0;
      background-color: #fff0f7;
      box-shadow: 0 6px 16px rgba(224,112,160,0.25);
    }

    .carta .emoji {
      font-size: 2.2rem;
      display: block;
      margin-bottom: 8px;
    }

    .carta .nombre {
      font-size: 0.95rem;
      font-weight: 700;
      color: #5a4a5a;
      margin-bottom: 6px;
      min-height: 2.4em;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .carta .votos {
      font-size: 0.9rem;
      color: #b080a0;
      background-color: #fdf0f8;
      border-radius: 20px;
      padding: 4px 10px;
      display: inline-block;
    }

    .carta .check {
      position: absolute;
      top: 8px;
      right: 8px;
      font-size: 1.1rem;
      display: none;
    }

    .carta.seleccionada .check { display: block; }

    .info-voto {
      text-align: center;
      margin-top: 25px;
      font-size: 0.9rem;
      color: #9a9aaa;
    }

    .mensaje {
      text-align: center;
      margin-top: 12px;
      font-size: 0.95rem;
      color: #6a9a6a;
      min-height: 1.4em;
    }

    footer {
      text-align: center;
      padding: 30px 20px;
      margin-top: 40px;
      color: #b0a0a8;
      font-size: 0.9rem;
      border-top: 1px solid #f0e0e8;
    }
  </style>
</head>
<body>

  <div class="banner">
    <h1>VOTACIONES</h1>
    <p>¡Elegí a tu personaje favorito de Roomies!</p>
  </div>

  <div class="contenido">

    <a class="volver" href="index.html">← Volver al inicio</a>

    <div class="pregunta">
      <h2>¿Cuál es tu personaje favorito?</h2>
      <p>Tocá una carta para votar. Tocala de nuevo para quitar tu voto.</p>
    </div>

    <div class="seccion-titulo">🌟 Personajes</div>

    <div class="grilla" id="grilla"></div>

    <div class="info-voto" id="info-voto"></div>
    <div class="mensaje" id="mensaje"></div>

  </div>

  <footer>
    Roomies Wiki — Votaciones
  </footer>

  <!-- 🔥 FIREBASE (base de datos gratis) -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <script>
    // ⚙️ CONFIGURACIÓN DE FIREBASE (tus datos)
    const firebaseConfig = {
      apiKey: "AIzaSyDrX8lGd73bI0TVY68YSK1bvvCppspsSQ4",
      authDomain: "roomies-wiki.firebaseapp.com",
      databaseURL: "https://roomies-wiki-default-rtdb.firebaseio.com",
      projectId: "roomies-wiki",
      storageBucket: "roomies-wiki.firebasestorage.app",
      messagingSenderId: "865809094565",
      appId: "1:865809094565:web:8aee3c4edf3c4dd6af3a4c",
      measurementId: "G-HSC7RLSC4M"
    };

    // 🌟 PERSONAJES (los que tienen página, todos en una sola sección)
    const PERSONAJES = [
      { id: 'wooly',     nombre: 'Wooly',           emoji: '🐑', votosIniciales: 5 },
      { id: 'ace',       nombre: 'Ace',             emoji: '🐺', votosIniciales: 3 },
      { id: 'lucky',     nombre: 'Lucky',           emoji: '🐱', votosIniciales: 4 },
      { id: 'clover',    nombre: 'Clover',          emoji: '🐰', votosIniciales: 1 },
      { id: 'oliver',    nombre: 'Oliver',          emoji: '😇', votosIniciales: 2 },
      { id: 'angel',     nombre: 'Angel',           emoji: '🕊️', votosIniciales: 2 },
      { id: 'gabriel',   nombre: 'Gabriel',         emoji: '🐶', votosIniciales: 2 },
      { id: 'alfa-kit',  nombre: 'Alfa-Kit',        emoji: '🤖', votosIniciales: 1 },
      { id: 'wahid',     nombre: 'Nº1 (Wahid)',     emoji: '🐈', votosIniciales: 1 },
      { id: 'zwei',      nombre: 'Nº2 (Zwei)',      emoji: '🐈‍⬛', votosIniciales: 1 },
      { id: 'mittsu',    nombre: 'Nº3 (Mittsu)',    emoji: '🐺', votosIniciales: 1 },
      { id: 'four',      nombre: 'Nº4 (Four)',      emoji: '🐑', votosIniciales: 1 },
      { id: 'nam',       nombre: 'Nº5 (Nam)',       emoji: '🦌', votosIniciales: 1 },
      { id: 'liu',       nombre: 'Nº6 (Liu)',       emoji: '🪼', votosIniciales: 1 },
      { id: 'diablo',    nombre: 'Diablo',          emoji: '😈', votosIniciales: 3 }
    ];

    let db = null;
    let firebaseListo = false;

    try {
      firebase.initializeApp(firebaseConfig);
      db = firebase.database();
      firebaseListo = true;
    } catch (e) {
      console.log('Firebase no pudo inicializarse:', e);
    }

    // Voto guardado del usuario (localStorage)
    let miVoto = localStorage.getItem('voto-roomies') || null;

    // Conteo actual de votos
    let conteo = {};
    PERSONAJES.forEach(p => { conteo[p.id] = p.votosIniciales; });

    // ---------- SEMBRAR VOTOS INICIALES (solo si la base está vacía) ----------

    function sembrarVotos() {
      if (!firebaseListo) return;
      db.ref('votaciones').once('value', snap => {
        if (!snap.exists()) {
          const datos = {};
          PERSONAJES.forEach(p => { datos[p.id] = p.votosIniciales; });
          db.ref('votaciones').set(datos);
        }
      });
    }

    // ---------- GUARDAR EN LOCAL (modo sin conexión) ----------

    function guardarLocal() {
      try {
        localStorage.setItem('votos-roomies-local', JSON.stringify(conteo));
      } catch (e) {}
    }

    function cargarLocal() {
      try {
        const guardado = localStorage.getItem('votos-roomies-local');
        if (guardado) {
          conteo = JSON.parse(guardado);
          PERSONAJES.forEach(p => { if (conteo[p.id] === undefined) conteo[p.id] = p.votosIniciales; });
        }
      } catch (e) {}
    }

    // ---------- PINTAR LAS CARTAS ----------

    function pintar() {
      const grilla = document.getElementById('grilla');
      grilla.innerHTML = '';

      PERSONAJES.forEach(p => {
        const carta = document.createElement('div');
        carta.className = 'carta' + (miVoto === p.id ? ' seleccionada' : '');
        carta.dataset.id = p.id;

        carta.innerHTML =
          '<span class="check">✅</span>' +
          '<span class="emoji">' + p.emoji + '</span>' +
          '<div class="nombre">' + p.nombre + '</div>' +
          '<span class="votos">' + (conteo[p.id] || 0) + ' votos</span>';

        carta.addEventListener('click', function () {
          votar(p.id);
        });

        grilla.appendChild(carta);
      });

      const info = document.getElementById('info-voto');
      if (miVoto) {
        const actual = PERSONAJES.find(p => p.id === miVoto);
        info.textContent = 'Tu voto actual: ' + (actual ? actual.nombre : miVoto);
      } else {
        info.textContent = 'Todavía no votaste. ¡Elegí a tu favorito!';
      }
    }

    // ---------- VOTAR / CAMBIAR / DESVOTAR ----------

    function votar(id) {
      if (miVoto === id) {
        // Desvotar
        conteo[id] = (conteo[id] || 0) - 1;
        miVoto = null;
      } else {
        // Cambiar de voto: resto el anterior si existía
        if (miVoto) {
          conteo[miVoto] = (conteo[miVoto] || 0) - 1;
        }
        conteo[id] = (conteo[id] || 0) + 1;
        miVoto = id;
      }

      localStorage.setItem('voto-roomies', miVoto);

      const mensaje = document.getElementById('mensaje');
      if (miVoto) {
        const actual = PERSONAJES.find(p => p.id === miVoto);
        mensaje.textContent = '¡Gracias por votar por ' + actual.nombre + '! 💛';
      } else {
        mensaje.textContent = 'Quitaste tu voto.';
      }

      if (firebaseListo) {
        db.ref('votaciones/' + id).set(conteo[id]);
        if (miVoto === null) {
          // ya resté el voto en conteo; guardo el valor actualizado del anterior
        }
        // Guardo también el valor del personaje desvotado
        const anterior = miVoto === null ? null : null;
        // Actualizo el nodo del personaje que perdió el voto (si hubo cambio)
        actualizarFirebase();
      }

      guardarLocal();
      pintar();
    }

    function actualizarFirebase() {
      // Guarda todos los conteos en Firebase para mantener sincronizado
      const datos = {};
      PERSONAJES.forEach(p => { datos[p.id] = conteo[p.id] || 0; });
      db.ref('votaciones').set(datos);
    }

    // ---------- ESCUCHAR CAMBIOS EN TIEMPO REAL ----------

    function escuchar() {
      if (!firebaseListo) return;
      db.ref('votaciones').on('value', snap => {
        const data = snap.val();
        if (!data) return;
        PERSONAJES.forEach(p => {
          if (typeof data[p.id] === 'number') {
            conteo[p.id] = data[p.id];
          }
        });
        pintar();
      });
    }

    // ---------- INICIAR ----------

    cargarLocal();
    sembrarVotos();
    escuchar();
    pintar();
  </script>

</body>
</html>
